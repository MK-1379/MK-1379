name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "0 0 * * *"   # todos los días a las 00:00 UTC
  workflow_dispatch:       # botón para lanzarlo a mano

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # necesario para poder hacer commit

    steps:
      - uses: actions/checkout@v6

      - name: Generar tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&hide_border=true&theme=github_dark
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit de las tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del README" || exit 0
          git push
